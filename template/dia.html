<!DOCTYPE html>

<html lang="zh-TW"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mandarin Pulse - Scenario Dialogue</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f6f6;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .message-bubble-left {
            position: relative;
            border-left: 4px solid #ec5b13;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#7f2b00",
                        "secondary-dim": "#833b00",
                        "on-secondary-fixed": "#115e59",
                        "tertiary": "#3b82f6",
                        "on-secondary-container": "#115e59",
                        "surface-container-low": "#f8f6f6",
                        "tertiary-container": "#dbeafe",
                        "inverse-surface": "#1e293b",
                        "surface-tint": "#ec5b13",
                        "outline-variant": "#cbd5e1",
                        "on-tertiary-fixed-variant": "#1e3a8a",
                        "error-dim": "#9f0519",
                        "primary-dim": "#8e3000",
                        "on-tertiary-container": "#1e40af",
                        "primary-fixed": "#ffdbce",
                        "surface-bright": "#ffffff",
                        "primary-container": "#ffedd5",
                        "inverse-on-surface": "#f8fafc",
                        "on-secondary-fixed-variant": "#134e4a",
                        "tertiary-fixed": "#dbeafe",
                        "tertiary-fixed-dim": "#bfdbfe",
                        "on-surface": "#0f172a",
                        "primary": "#ec5b13",
                        "surface-container-highest": "#e0e0e0",
                        "on-primary-fixed": "#370e00",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#475569",
                        "inverse-primary": "#ffb599",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e8e8e8",
                        "on-tertiary-fixed": "#1e40af",
                        "error": "#ef4444",
                        "surface": "#ffffff",
                        "secondary": "#0d9488",
                        "on-primary-container": "#7c2d12",
                        "surface-dim": "#f8f6f6",
                        "secondary-fixed": "#ccfbf1",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#f1f5f9",
                        "primary-fixed-dim": "#ffb599",
                        "on-error": "#ffffff",
                        "on-background": "#0f172a",
                        "on-error-container": "#991b1b",
                        "secondary-fixed-dim": "#99f6e4",
                        "secondary-container": "#ccfbf1",
                        "background": "#f8f6f6",
                        "surface-container": "#f1f1f1",
                        "error-container": "#fee2e2",
                        "outline": "#e2e8f0"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-dim text-on-surface">
<!-- Top Navigation Anchor (As per JSON) -->
<nav class="bg-white dark:bg-slate-950 shadow-sm border-b border-slate-100 dark:border-slate-800 flex justify-between items-center px-4 h-16 w-full fixed top-0 z-50">
<div class="flex items-center gap-3">
<button class="transition-transform active:scale-95 text-slate-500">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<span class="font-['Plus_Jakarta_Sans'] font-bold text-orange-600 dark:text-orange-500 text-xl font-black">Mandarin Pulse</span>
</div>
<div class="flex items-center gap-2">
<div class="h-8 w-8 rounded-full bg-slate-200 overflow-hidden">
<img class="h-full w-full object-cover" data-alt="User profile avatar image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBc_C0zdwt9t4kQjc0EJtlRYAubiDiT38rqazGqGY06n1weOWoCRJMkE8LhCHdU84ZUndtvXLNsPZRgIjFRimVSR78gdKUmR08rgAmDWlTDh06UqGd59RujpxMovI8h3tOpqnHDlSymILPYRE2-gzR8MxZNMoAdHIi2f-kej7pf5uOzTKZziZQLgI6xIWvkDsCmeusGf23S1L0xNLChWJBoNN1yaVNtl-SVC3lJI1iq9A7xGTxVLV8mPXIR-P5czzd0llY0Zp5xRXBm"/>
</div>
<span class="material-symbols-outlined text-slate-500" data-icon="settings">settings</span>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="pt-20 pb-24 min-h-screen px-4 max-w-2xl mx-auto flex flex-col">
<!-- Progress Indicator -->
<div class="mb-6">
<div class="flex justify-between items-end mb-2">
<span class="text-[10px] uppercase tracking-widest font-bold text-secondary">Scenario: Restaurant Booking</span>
<span class="text-xs font-semibold text-on-surface-variant">Step 3 of 5</span>
</div>
<div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
<div class="h-full bg-primary w-[60%] transition-all duration-500"></div>
</div>
</div>
<!-- Chat History Area -->
<div class="flex-grow space-y-6 overflow-y-auto custom-scrollbar pr-1">
<!-- NPC Message 1 -->
<div class="flex items-start gap-3">
<div class="w-10 h-10 rounded-xl bg-primary-container flex items-center justify-center shrink-0 shadow-sm">
<span class="material-symbols-outlined text-primary" data-icon="person">person</span>
</div>
<div class="flex flex-col gap-1 max-w-[85%]">
<div class="bg-surface shadow-sm rounded-2xl rounded-tl-none p-4 message-bubble-left">
<p class="text-lg font-bold leading-relaxed">你好！歡迎光臨。</p>
<p class="text-on-surface-variant text-sm mt-1">Hello! Welcome.</p>
</div>
</div>
</div>
<!-- User Response 1 (History) -->
<div class="flex items-start gap-3 flex-row-reverse">
<div class="w-10 h-10 rounded-xl bg-secondary-container flex items-center justify-center shrink-0 shadow-sm">
<span class="material-symbols-outlined text-secondary" data-icon="face">face</span>
</div>
<div class="flex flex-col gap-1 max-w-[85%] items-end">
<div class="bg-secondary text-white shadow-sm rounded-2xl rounded-tr-none p-4">
<p class="text-lg font-bold leading-relaxed">我想訂一個位子。</p>
<p class="text-secondary-fixed text-sm mt-1 opacity-90">I'd like to book a table.</p>
</div>
</div>
</div>
<!-- NPC Current Challenge -->
<div class="flex items-start gap-3">
<div class="relative">
<div class="w-10 h-10 rounded-xl bg-primary-container flex items-center justify-center shrink-0 shadow-sm overflow-hidden">
<img class="h-full w-full object-cover" data-alt="Female restaurant staff avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHX-631kPKSJ68mYY0iCQc0C1o_OV9KSS1pKrNDhu6ySPyppxBkMaCipKNK7I7SmOZFOmtkZ9TIrxXr7OKBV8KC5IWi_mCyVbtGG7spoLwpH6_nlxnkRdiaA0qu9AI12vmKu60QUxWdkj_i2xvKg7CTewyc4Z_2ysovD9QNf1qDLpnJHTueeIefcFZs9wr2VPzf0uv2OhC4N3o8eXGQsYNPzPZZ_eZmgk6vHx7D7WJQErfxxm1OQwRv1e1QY8TPurTNy46SIzSnBOL"/>
</div>
<div class="absolute -bottom-1 -right-1 bg-green-500 w-3 h-3 rounded-full border-2 border-white"></div>
</div>
<div class="flex flex-col gap-1 max-w-[85%]">
<div class="bg-surface shadow-sm rounded-2xl rounded-tl-none p-4 message-bubble-left">
<p class="text-xl font-black text-on-surface leading-snug">好的。請問一共是幾位呢？</p>
<button class="flex items-center gap-1.5 text-primary text-xs font-bold mt-3 tracking-wide uppercase group">
<span class="material-symbols-outlined text-sm" data-icon="translate">translate</span>
                            Show Translation
                        </button>
</div>
</div>
</div>
<!-- Real-time Feedback Toast (Hidden by default, shown for correct/incorrect) -->
<div class="flex justify-center">
<div class="glass-card px-6 py-2 rounded-full border-secondary/20 flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="check_circle" data-weight="fill">check_circle</span>
<span class="text-sm font-bold text-secondary">Correct! You're making progress.</span>
</div>
</div>
</div>
<!-- Sticky Interaction Zone -->
<div class="fixed bottom-20 left-0 w-full px-4 pb-4">
<div class="max-w-2xl mx-auto">
<div class="bg-white/80 backdrop-blur-md p-4 rounded-3xl shadow-lg border border-slate-100">
<p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4 text-center">Choose your response</p>
<div class="grid grid-cols-1 gap-3">
<!-- Choice 1 -->
<button class="flex items-center justify-between p-4 bg-surface-container-low rounded-2xl border-2 border-transparent hover:border-primary/30 transition-all active:scale-[0.98] text-left group">
<div class="flex flex-col">
<span class="text-lg font-bold text-on-surface">我們一共兩位。</span>
<span class="text-xs text-on-surface-variant font-medium">There are two of us.</span>
</div>
<div class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-primary text-sm" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
<!-- Choice 2 -->
<button class="flex items-center justify-between p-4 bg-surface-container-low rounded-2xl border-2 border-transparent hover:border-primary/30 transition-all active:scale-[0.98] text-left group">
<div class="flex flex-col">
<span class="text-lg font-bold text-on-surface">什麼時候？</span>
<span class="text-xs text-on-surface-variant font-medium">What time?</span>
</div>
<div class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-primary text-sm" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
<!-- Choice 3 (Asymmetric / Long) -->
<button class="flex items-center justify-between p-4 bg-surface-container-low rounded-2xl border-2 border-transparent hover:border-primary/30 transition-all active:scale-[0.98] text-left group">
<div class="flex flex-col">
<span class="text-lg font-bold text-on-surface">我要點菜。</span>
<span class="text-xs text-on-surface-variant font-medium">I want to order food.</span>
</div>
<div class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-primary text-sm" data-icon="arrow_forward">arrow_forward</span>
</div>
</button>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Shell (As per JSON) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-4 pb-safe bg-white dark:bg-slate-950 border-t border-slate-100 dark:border-slate-800 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
<div class="flex flex-col items-center justify-center text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-900/20 rounded-xl px-3 py-1 transition-all duration-200 ease-in-out">
<span class="material-symbols-outlined" data-icon="school">school</span>
<span class="font-['Plus_Jakarta_Sans'] text-xs font-semibold">Study</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-teal-600 dark:hover:text-teal-400 transition-all duration-200 ease-in-out">
<span class="material-symbols-outlined" data-icon="forum">forum</span>
<span class="font-['Plus_Jakarta_Sans'] text-xs font-semibold">Dialogue</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-teal-600 dark:hover:text-teal-400 transition-all duration-200 ease-in-out">
<span class="material-symbols-outlined" data-icon="hearing">hearing</span>
<span class="font-['Plus_Jakarta_Sans'] text-xs font-semibold">Listen</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-teal-600 dark:hover:text-teal-400 transition-all duration-200 ease-in-out">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-xs font-semibold">Profile</span>
</div>
</nav>
<!-- Floating Help Action (Optional/Contextual FAB) -->
<div class="fixed bottom-40 right-4 md:right-8 z-40">
<button class="w-14 h-14 bg-on-tertiary-fixed-variant text-white rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="lightbulb">lightbulb</span>
</button>
</div>
</body></html>
