            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border-2 border-primary">

</div>
<h1 class="Mandarin Pulse text-xl font-black text-orange-600 dark:text-orange-500 font-['Plus_Jakarta_Sans']">Mandarin Pulse</h1>
</div>
<button class="transition-transform active:scale-95 p-2 rounded-full hover:bg-slate-50 dark:hover:bg-slate-900 text-slate-500">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<main class="flex-grow flex flex-col items-center px-6 py-8 max-w-2xl mx-auto w-full mb-24">
<!-- Progress Section -->
<div class="w-full mb-10">
<div class="flex justify-between items-end mb-3">
<span class="text-xs font-bold tracking-widest uppercase text-on-surface-variant">Current Session</span>
<span class="text-sm font-extrabold text-primary">5 / 20 <span class="text-on-surface-variant font-medium">words</span></span>
</div>
<div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/4 rounded-full transition-all duration-500"></div>
</div>
</div>
<!-- Asymmetric Bento Header (Visual Flair) -->
<div class="grid grid-cols-3 gap-4 w-full mb-8">
<div class="col-span-2 bg-teal-700 text-white p-5 rounded-[24px] flex flex-col justify-between shadow-lg h-32 relative overflow-hidden group">
<div class="relative z-10">
<p class="text-[10px] uppercase tracking-[0.2em] font-bold opacity-80 mb-1">Current Topic</p>
<h2 class="text-xl font-bold">基本詞彙練習</h2>
</div>
<div class="relative z-10 flex items-center gap-1 text-xs font-semibold bg-white/20 w-fit px-2 py-1 rounded-full">
<span class="material-symbols-outlined text-[14px]" data-icon="trending_up">trending_up</span>
                    Level A1
                </div>
<div class="absolute -right-4 -bottom-4 opacity-20 transform group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-8xl" data-icon="translate">translate</span>
</div>
</div>
<div class="bg-orange-600 text-white p-5 rounded-[24px] flex flex-col items-center justify-center shadow-lg h-32 transition-transform active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-4xl mb-1" data-icon="timer">timer</span>
<span class="text-xs font-bold">12:45</span>
</div>
</div>
<!-- Main Flashcard -->
<div class="w-full aspect-[3/4] max-h-[500px] relative rounded-[32px] overflow-hidden shadow-xl bg-white border-l-[6px] border-primary group">
<!-- Background Image with Gradient Overlay -->
<div class="absolute inset-0 w-full h-full">
<img alt="Travel scenery" class="w-full h-full object-cover" data-alt="Vibrant tropical landscape with turquoise water" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDF2PXYzIh1yv7WOPRNm9IHTxf7GG2BQf0jcOesLn5-ZEnJhCz-NzUf5hgHB-PEKYsgAw9osehC6BudGbL9Bb6-5WZeG6ApDT03BqWQtHexA-t-97yMkdDz015MXBBJXLeQp6DJgfyyLXFmHXWYCSIefLSDBUN_bwYgPuZ_WIMcK-8P9-3utzRhmkrw3jBlWZ3gOQlPMr5MOyVUNMOxik0N96rXrvV8NU7iPa9UcDvKHCYb85zUB7ro3UYitD4kIx1AjyWDvN3_GwJ5"/>
<div class="absolute inset-0 flashcard-gradient"></div>
</div>
<!-- Card Content Overlay -->
<div class="absolute inset-0 flex flex-col justify-between p-8">
<div class="flex justify-between items-start">
<div class="glass-card px-4 py-2 rounded-2xl flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="category">category</span>
<span class="text-xs font-extrabold text-on-surface uppercase tracking-wider">Travel</span>
</div>
<button class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center shadow-lg hover:scale-110 active:scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</button>
</div>
<div class="flex flex-col items-center text-center">
<h3 class="text-white text-6xl font-black mb-4 tracking-tight">旅遊</h3>
<div class="glass-card px-6 py-3 rounded-2xl">
<p class="text-primary text-xl font-bold tracking-wide">Lǚyóu</p>
<div class="h-px w-full bg-slate-200 my-2"></div>
<p class="text-on-surface font-semibold">To Travel / Tourism</p>
</div>
</div>
<div class="flex justify-center">
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-white/40"></div>
<div class="w-2 h-2 rounded-full bg-white"></div>
<div class="w-2 h-2 rounded-full bg-white/40"></div>
<div class="w-2 h-2 rounded-full bg-white/40"></div>
</div>
</div>
</div>
</div>

<div class="grid grid-cols-2 gap-4 w-full mt-10">
<button class="flex items-center justify-center gap-3 bg-surface border-2 border-slate-100 py-4 rounded-2xl font-bold text-on-surface-variant hover:bg-slate-50 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-error" data-icon="refresh">refresh</span>
                Keep Practicing
            </button>
<button class="flex items-center justify-center gap-3 bg-primary py-4 rounded-2xl font-bold text-white shadow-lg shadow-primary/20 hover:bg-primary-dim transition-all active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>

            </button>
</div>

<a class="flex flex-col items-center justify-center text-orange-600 dark:text-orange-400 bg-orange-50 dark:bg-orange-900/20 rounded-xl px-3 py-1 transition-all duration-200 ease-in-out" href="#">

<span class="font-['Plus_Jakarta_Sans'] text-xs font-semibold">Study</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-teal-600 dark:hover:text-teal-400 transition-all duration-200 ease-in-out" href="/practice/{{ session.get('topic', 'cuisine') }}/dia">
<span class="material-symbols-outlined" data-icon="forum">forum</span>
<span class="font-['Plus_Jakarta_Sans'] text-xs font-semibold">Dialogue</span>
</a>

<span class="material-symbols-outlined" data-icon="hearing">hearing</span>
<span class="font-['Plus_Jakarta_Sans'] text-xs font-semibold">Listen</span>

<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-xs font-semibold">Profile</span>
