<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>華語知識王 - Matchmaking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#ec5b13",
                    "secondary": "#0d9488",
                    "background-light": "#f8f6f6",
                    "background-dark": "#221610",
                },
                fontFamily: { "display": ["Plus Jakarta Sans", "sans-serif"] },
                borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            },
        },
    }
</script>
<style>
    body { min-height: max(884px, 100dvh); }
    .pulse-ring {
        animation: pulseRing 1.5s ease-out infinite;
    }
    @keyframes pulseRing {
        0% { transform: scale(0.8); opacity: 1; }
        100% { transform: scale(1.6); opacity: 0; }
    }
    .progress-bar { transition: width 0.3s ease; }
    .opponent-enter { animation: slideIn 0.5s ease-out; }
    @keyframes slideIn {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    .found-flash { animation: flash 0.3s ease-out 3; }
    @keyframes flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }
</style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto">

<!-- Top Header -->
<header class="flex justify-between items-center px-4 h-16 bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 shadow-sm dark:shadow-none sticky top-0 z-10">

</a>
<h1 class="text-xl font-black text-orange-600 dark:text-orange-400">華語知識王</h1>
</div>
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-slate-200 overflow-hidden">
<img alt="user profile picture" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAnpXlRBOKHaLgM3fc7tiboO_5OUidVfpBL7z-VVZq7eHlwx_hsDSh8AaTP-L5p-vVw6LZuU7VgswQ4wd075dyBvLtvtJ9N2mlbyrjtmRHFT2nVg8m2Cebu_aATkSAPh6_mPAH55qBZdmpDdEC_nYFdvnCepevihbVn_l9A93iRrRaSsVI1WnTNyAZe6gvRgnTnh3C4sTtdAK262mZJFXW9NoOrb0n2NcOmvtSmghPnF0yatGKZCVVWctGOf__FFPYDPye4HWgKtgK"/>
</div>
<button onclick="showHelp()" class="material-symbols-outlined text-slate-500 hover:bg-slate-50 p-2 rounded-full cursor-pointer active:scale-95 transition-transform">help</button>
</div>
</header>

<!-- ===================== SELECTION VIEW ===================== -->
<div id="selectionView" class="flex-1 flex flex-col p-4 pb-24 gap-6">

    <!-- Header -->
    <div class="pt-2">
        <h1 class="text-slate-900 dark:text-slate-100 text-lg font-bold">挑戰設定</h1>
        <p class="text-sm text-slate-500 mt-1">選擇難度與題目類型後開始配對</p>
    </div>

    <!-- Difficulty -->
    <section>
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-slate-900 dark:text-slate-100 font-bold text-lg">Difficulty</h3>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="selectLevel('A1A2', this)" id="level-A1A2"
                class="level-btn bg-blue-50 dark:bg-blue-900/20 p-4 rounded-xl border border-blue-100 dark:border-blue-800 hover:border-primary transition-colors text-left active:scale-[0.98] selected-level">
                <div class="bg-blue-500 text-white w-10 h-10 rounded-lg flex items-center justify-center mb-3">
                    <span class="material-symbols-outlined">school</span>
                </div>
                <h4 class="font-bold text-slate-900 dark:text-slate-100 text-sm">A1A2</h4>
                <p class="text-xs text-slate-500 dark:text-slate-400">Elementary</p>
            </button>
            <button onclick="selectLevel('B1B2', this)" id="level-B1B2"
                class="level-btn bg-amber-50 dark:bg-amber-900/20 p-4 rounded-xl border border-amber-100 dark:border-amber-800 hover:border-primary transition-colors text-left active:scale-[0.98]">
                <div class="bg-amber-500 text-white w-10 h-10 rounded-lg flex items-center justify-center mb-3">
                    <span class="material-symbols-outlined">emoji_events</span>
                </div>
                <h4 class="font-bold text-slate-900 dark:text-slate-100 text-sm">B1B2</h4>
                <p class="text-xs text-slate-500 dark:text-slate-400">Intermediate</p>
            </button>
        </div>
    </section>

    <!-- Category -->
    <section>
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-slate-900 dark:text-slate-100 font-bold text-lg">Category</h3>
        </div>
        <div class="grid grid-cols-3 gap-4">
            <button onclick="selectCategory('vocabulary', this)" id="cat-vocabulary"
                class="cat-btn bg-orange-50 dark:bg-orange-900/20 p-4 rounded-xl border border-orange-100 dark:border-orange-800 hover:border-primary transition-colors text-left active:scale-[0.98]">
                <div class="bg-primary text-white w-10 h-10 rounded-lg flex items-center justify-center mb-3">
                    <span class="material-symbols-outlined">menu_book</span>
                </div>
                <h4 class="font-bold text-slate-900 dark:text-slate-100 text-sm">Vocab</h4>
                <p class="text-xs text-slate-500 dark:text-slate-400">詞彙</p>
            </button>
            <button onclick="selectCategory('grammar', this)" id="cat-grammar"
                class="cat-btn bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-xl border border-emerald-100 dark:border-emerald-800 hover:border-primary transition-colors text-left active:scale-[0.98]">
                <div class="bg-emerald-500 text-white w-10 h-10 rounded-lg flex items-center justify-center mb-3">
                    <span class="material-symbols-outlined">spellcheck</span>
                </div>
                <h4 class="font-bold text-slate-900 dark:text-slate-100 text-sm">Grammar</h4>
                <p class="text-xs text-slate-500 dark:text-slate-400">語法</p>
            </button>
            <button onclick="selectCategory('mixed', this)" id="cat-mixed"
                class="cat-btn bg-purple-50 dark:bg-purple-900/20 p-4 rounded-xl border border-purple-100 dark:border-purple-800 hover:border-primary transition-colors text-left active:scale-[0.98] selected-cat">
                <div class="bg-purple-500 text-white w-10 h-10 rounded-lg flex items-center justify-center mb-3">
                    <span class="material-symbols-outlined">shuffle</span>
                </div>
                <h4 class="font-bold text-slate-900 dark:text-slate-100 text-sm">Mixed</h4>
                <p class="text-xs text-slate-500 dark:text-slate-400">混合</p>
            </button>
        </div>
    </section>

    <!-- Start Button — 和介面.html 的 START GAME 完全相同 -->
    <div class="px-4 py-2">
        <button onclick="startMatchmaking()"
            class="w-full flex items-center justify-center gap-3 bg-secondary hover:bg-secondary/90 text-white font-bold py-5 rounded-xl shadow-lg transition-transform active:scale-[0.98]">
            <span class="material-symbols-outlined text-3xl">swords</span>
            <div class="text-left">
                <p class="text-lg leading-none">START GAME</p>
                <p class="text-xs opacity-80 font-normal">Challenge the Mandarin Trivia</p>
            </div>
        </button>
    </div>

</div>
<style>
    .selected-level { outline: 2px solid #ec5b13; }
    .selected-cat   { outline: 2px solid #ec5b13; }
</style>

<!-- ===================== MATCHMAKING VIEW ===================== -->
<div id="matchmakingView" class="hidden flex-1 flex flex-col items-center p-6 gap-6">

    <!-- Level & Category Status -->
    <div class="flex gap-3 w-full">
        <div class="flex-1 flex flex-col items-center p-3 rounded-xl border-2 border-primary bg-primary/5">
            <span class="text-xs font-bold text-primary uppercase tracking-wider">Level</span>
            <span id="matchLevel" class="text-xl font-extrabold">A1A2</span>
        </div>
        <div class="flex-1 flex flex-col items-center p-3 rounded-xl border-2 border-secondary bg-secondary/5">
            <span class="text-xs font-bold text-secondary uppercase tracking-wider">Category</span>
            <span id="matchCategory" class="text-xl font-extrabold">Mixed</span>
        </div>
    </div>

    <!-- Matchmaking Visual -->
    <div class="w-full flex flex-col items-center gap-8 py-4">
        <div class="flex w-full items-center justify-around relative">
            <!-- Player (You) -->
            <div class="flex flex-col items-center gap-3 z-10">
                <div class="relative">
                    <div class="size-24 rounded-full border-4 border-primary p-1 bg-white dark:bg-slate-800 shadow-xl overflow-hidden">
                        <div class="w-full h-full rounded-full bg-gradient-to-br from-primary to-orange-300 flex items-center justify-center">
                            <span class="material-symbols-outlined text-white text-4xl">person</span>
                        </div>
                    </div>
                    <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-primary text-white text-[10px] font-black px-3 py-0.5 rounded-full uppercase whitespace-nowrap">You</div>
                </div>
                <div class="text-center">
                    <p class="font-bold text-sm">英雄玩家</p>
                    <p class="text-xs font-medium text-primary">Level 15</p>
                </div>
            </div>

            <!-- VS -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20">
                <div class="size-14 rounded-full bg-primary flex items-center justify-center shadow-lg border-4 border-background-light">
                    <span class="text-xl font-black italic text-white">VS</span>
                </div>
            </div>

            <!-- Opponent -->
            <div id="opponentSlot" class="flex flex-col items-center gap-3 z-10">
                <!-- Searching state -->
                <div id="searchingAvatar" class="relative">
                    <div class="size-24 rounded-full border-4 border-dashed border-slate-300 p-1 bg-slate-100 dark:bg-slate-900 flex items-center justify-center">
                        <span class="material-symbols-outlined text-4xl text-slate-400 animate-pulse">person_search</span>
                    </div>
                    <div class="absolute inset-0 rounded-full border-4 border-primary/30 pulse-ring"></div>
                </div>
                <div id="searchingText" class="text-center">
                    <p class="font-bold text-sm text-slate-400">Searching...</p>
                    <p class="text-xs text-slate-400" id="waitTime">Rating 1200+</p>
                </div>

                <!-- Found state (hidden initially) -->
                <div id="foundAvatar" class="relative hidden opponent-enter">
                    <div class="size-24 rounded-full border-4 border-slate-500 p-1 bg-white dark:bg-slate-800 shadow-xl overflow-hidden">
                        <div class="w-full h-full rounded-full bg-gradient-to-br from-slate-500 to-slate-700 flex items-center justify-center">
                            <span class="material-symbols-outlined text-white text-4xl">smart_toy</span>
                        </div>
                    </div>
                    <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-slate-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full uppercase whitespace-nowrap">BOT</div>
                </div>
                <div id="foundText" class="text-center hidden">
                    <p id="botName" class="font-bold text-sm"></p>
                    <p id="botLevel" class="text-xs font-medium text-slate-500"></p>
                </div>
            </div>

            <!-- Connection line -->
            <div class="absolute top-12 w-full h-1 bg-gradient-to-r from-primary/40 via-primary to-primary/40 rounded-full -z-0"></div>
        </div>

        <!-- Status -->
        <div class="w-full space-y-3 text-center">
            <h2 id="statusText" class="text-xl font-black text-slate-900 dark:text-slate-100">配對中... Finding Opponent</h2>
            <p id="statusSub" class="text-slate-500 text-sm font-medium">預計等待 <span class="text-primary font-bold" id="countdown">3</span> 秒</p>
            <div class="w-full h-3 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-primary rounded-full shadow-[0_0_10px_rgba(236,91,19,0.5)] progress-bar" style="width:0%"></div>
            </div>
        </div>
    </div>

    <!-- Cancel -->
    <button onclick="cancelMatchmaking()"
        class="w-full py-4 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-bold rounded-xl flex items-center justify-center gap-2 hover:bg-slate-300 transition-colors">
        <span class="material-symbols-outlined">close</span>
        Cancel Matchmaking
    </button>

</div>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto flex justify-around items-center px-2 h-20 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-20">
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 active:scale-90 transition-all duration-150" href="/">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-bold">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-orange-100 dark:bg-orange-900/30 text-orange-700 dark:text-orange-300 rounded-2xl px-4 py-1 active:scale-90 transition-all duration-150" href="/lobby">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">trophy</span>
<span class="text-[10px] font-bold">Leagues</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 active:scale-90 transition-all duration-150" href="/friends">
<span class="material-symbols-outlined">group</span>
<span class="text-[10px] font-bold">Friends</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-4 py-1 active:scale-90 transition-all duration-150" href="/profile">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-bold">Profile</span>
</a>
</nav>
</div>

<script>
    // ── State ──────────────────────────────────────────
    let selectedLevel = 'A1A2';
    let selectedCategory = 'mixed';
    let matchmakingTimer = null;

    const categoryLabels = {
        vocabulary: 'Vocabulary',
        grammar: 'Grammar',
        mixed: 'Mixed'
    };

    const botNames = [
        '小明 (Xiaoming)', '語言達人 Pro', 'MeiMei 妹妹',
        '台灣通 Master', '小龍 (Xiaolong)', 'TaipeiPro 88',
        '普通話王', 'LinguaBot 語', 'DragonLearner'
    ];
    const botLevels = ['Level 8', 'Level 11', 'Level 14', 'Level 17', 'Level 9', 'Level 20', 'Level 6'];

    // ── Selection helpers ──────────────────────────────
    function selectLevel(level, btn) {
        selectedLevel = level;
        document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('selected-level'));
        btn.classList.add('selected-level');
    }

    function selectCategory(cat, btn) {
        selectedCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected-cat'));
        btn.classList.add('selected-cat');
    }

    // ── Matchmaking ────────────────────────────────────
    function startMatchmaking() {
        // Update match display
        document.getElementById('matchLevel').textContent = selectedLevel;
        document.getElementById('matchCategory').textContent = categoryLabels[selectedCategory];

        // Switch views
        document.getElementById('selectionView').classList.add('hidden');
        document.getElementById('matchmakingView').classList.remove('hidden');
        document.getElementById('matchmakingView').classList.add('flex');

        // Pick random bot
        const botName = botNames[Math.floor(Math.random() * botNames.length)];
        const botLv = botLevels[Math.floor(Math.random() * botLevels.length)];
        const matchDuration = 2500 + Math.random() * 1500; // 2.5 – 4s

        // Progress bar animation
        const bar = document.getElementById('progressBar');
        let progress = 0;
        const countdownEl = document.getElementById('countdown');
        let remaining = Math.ceil(matchDuration / 1000);
        countdownEl.textContent = remaining;

        const tick = setInterval(() => {
            progress += 2;
            bar.style.width = Math.min(progress, 95) + '%';
            remaining = Math.max(0, remaining - 1);
            countdownEl.textContent = remaining;
        }, matchDuration / 50);

        // Found opponent
        matchmakingTimer = setTimeout(() => {
            clearInterval(tick);
            bar.style.width = '100%';

            // Show found opponent
            document.getElementById('searchingAvatar').classList.add('hidden');
            document.getElementById('searchingText').classList.add('hidden');
            document.getElementById('foundAvatar').classList.remove('hidden');
            document.getElementById('foundText').classList.remove('hidden');
            document.getElementById('botName').textContent = botName;
            document.getElementById('botLevel').textContent = botLv;

            document.getElementById('statusText').textContent = '✅ 對手找到了！Match Found!';
            document.getElementById('statusText').classList.add('text-green-600', 'found-flash');
            document.getElementById('statusSub').textContent = '即將開始遊戲...';

            // Redirect to game
            matchmakingTimer = setTimeout(() => {
                window.location.href = `/start_game_lobby?level=${selectedLevel}&category=${selectedCategory}`;
            }, 1200);
        }, matchDuration);
    }

    function cancelMatchmaking() {
        if (matchmakingTimer) clearTimeout(matchmakingTimer);
        // Reset to selection view
        document.getElementById('matchmakingView').classList.add('hidden');
        document.getElementById('matchmakingView').classList.remove('flex');
        document.getElementById('selectionView').classList.remove('hidden');
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('searchingAvatar').classList.remove('hidden');
        document.getElementById('searchingText').classList.remove('hidden');
        document.getElementById('foundAvatar').classList.add('hidden');
        document.getElementById('foundText').classList.add('hidden');
        document.getElementById('statusText').textContent = '配對中... Finding Opponent';
        document.getElementById('statusText').classList.remove('text-green-600', 'found-flash');
        document.getElementById('countdown').textContent = '3';
    }

    function showHelp() {
        alert('遊戲規則 Game Rules：\n\n🎯 選擇難度：A1A2（初級）或 B1B2（中級）\n📚 選擇類型：詞彙 / 語法 / 混合\n⚔️ 系統自動配對對手\n❓ 每局 5 題，答對得分\n🏆 答完後查看成績！');
    }
</script>
</body></html>
