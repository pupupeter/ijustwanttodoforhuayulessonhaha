<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;700&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "secondary": "#0d9488",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: { "display": ["Plus Jakarta Sans"] },
                },
            },
        }
    </script>
    <title>題目管理 - 華語知識王</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col max-w-4xl mx-auto shadow-2xl bg-white dark:bg-slate-900 overflow-x-hidden">
    <header class="flex items-center p-6 justify-between border-b border-slate-100 dark:border-slate-800 sticky top-0 bg-white dark:bg-slate-900 z-40">
        <div class="flex items-center gap-4">
            <a href="/" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <span class="material-symbols-outlined text-slate-400">arrow_back</span>
            </a>
            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">題目管理</h2>
        </div>
        <button id="addQuestionBtn" class="flex items-center gap-2 bg-primary hover:bg-primary/90 text-white font-bold px-4 py-2 rounded-xl transition-colors">
            <span class="material-symbols-outlined">add</span>
            新增題目
        </button>
    </header>

    <main class="flex-1 p-6">
        <!-- Filters -->
        <div class="mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
            <input type="text" id="searchInput" placeholder="搜尋題目..."
                   class="px-4 py-2 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-0">
            <select id="levelFilter" class="px-4 py-2 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-0">
                <option value="">全部級別</option>
                <option value="A2">A2</option>
                <option value="B1">B1</option>
            </select>
            <select id="topicFilter" class="px-4 py-2 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-0">
                <option value="">全部主題</option>
                <option value="cuisine">美食 Cuisine</option>
                <option value="shopping">購物 Shopping</option>
                <option value="tourism">旅遊 Tourism</option>
                <option value="worklife">職場 Work Life</option>
            </select>
            <select id="typeFilter" class="px-4 py-2 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-0">
                <option value="">全部類型</option>
                <option value="vocabulary">詞彙</option>
                <option value="dialogue">對話</option>
                <option value="listening">聽力</option>
            </select>
        </div>

        <!-- Questions List -->
        <div id="questionsList" class="space-y-4">
            <!-- Questions will be loaded here -->
        </div>

        <!-- Pagination -->
        <div id="pagination" class="flex items-center justify-center gap-4 mt-6">
            <button id="prevPageBtn" class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 disabled:opacity-50" disabled>
                上一頁
            </button>
            <span id="pageInfo" class="text-sm text-slate-500">第 1 頁</span>
            <button id="nextPageBtn" class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 disabled:opacity-50">
                下一頁
            </button>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden py-16 text-center">
            <span class="material-symbols-outlined text-6xl text-slate-300 dark:text-slate-600 mb-4">quiz</span>
            <h3 class="text-xl font-bold text-slate-500 dark:text-slate-400 mb-2">沒有找到題目</h3>
            <p class="text-slate-400 dark:text-slate-500">點擊「新增題目」開始建立題庫</p>
        </div>
    </main>
</div>

<!-- Question Modal -->
<div id="questionModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
        <div class="p-6 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between sticky top-0 bg-white dark:bg-slate-800">
            <h3 id="modalTitle" class="text-xl font-bold">新增題目</h3>
            <button id="closeModalBtn" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form id="questionForm" class="p-6 space-y-4">
            <input type="hidden" id="questionId">

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 dark:text-slate-400 mb-2">類型</label>
                    <select id="formType" required class="w-full px-4 py-2 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-0">
                        <option value="vocabulary">詞彙</option>
                        <option value="dialogue">對話</option>
                        <option value="listening">聽力</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 dark:text-slate-400 mb-2">級別</label>
                    <select id="formLevel" required class="w-full px-4 py-2 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-0">
                        <option value="A2">A2</option>
                        <option value="B1">B1</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 dark:text-slate-400 mb-2">主題</label>
                <select id="formTopic" required class="w-full px-4 py-2 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-0">
                    <option value="cuisine">美食 Cuisine</option>
                    <option value="shopping">購物 Shopping</option>
                    <option value="tourism">旅遊 Tourism</option>
                    <option value="worklife">職場 Work Life</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 dark:text-slate-400 mb-2">題目文字</label>
                <textarea id="formQuestionText" required rows="3" class="w-full px-4 py-2 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-0" placeholder="輸入題目內容..."></textarea>
            </div>

            <div id="audioTextSection">
                <label class="block text-sm font-semibold text-slate-600 dark:text-slate-400 mb-2">
                    TTS 音檔文字
                    <span class="text-xs font-normal text-slate-400">(聽力題專用)</span>
                </label>
                <input type="text" id="formAudioText" class="w-full px-4 py-2 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-0" placeholder="輸入要轉為語音的文字...">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 dark:text-slate-400 mb-2">選項</label>
                <div id="optionsContainer" class="space-y-2">
                    <!-- Options will be added here -->
                </div>
                <button type="button" id="addOptionBtn" class="mt-2 text-sm text-primary hover:text-primary/80 flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">add</span>
                    新增選項
                </button>
            </div>

            <div class="pt-4 flex gap-3">
                <button type="button" id="cancelBtn" class="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 font-semibold transition-colors">
                    取消
                </button>
                <button type="submit" class="flex-1 py-3 rounded-xl bg-primary hover:bg-primary/90 text-white font-semibold transition-colors">
                    儲存
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 text-center">
        <div class="w-16 h-16 rounded-full bg-red-100 dark:bg-red-900/30 mx-auto mb-4 flex items-center justify-center">
            <span class="material-symbols-outlined text-red-500 text-3xl">delete</span>
        </div>
        <h3 class="text-xl font-bold mb-2">確定刪除？</h3>
        <p class="text-slate-500 dark:text-slate-400 mb-6">此操作無法復原</p>
        <div class="flex gap-3">
            <button id="cancelDeleteBtn" class="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 font-semibold transition-colors">
                取消
            </button>
            <button id="confirmDeleteBtn" class="flex-1 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-semibold transition-colors">
                刪除
            </button>
        </div>
    </div>
</div>

<script>
    class QuestionManager {
        constructor() {
            this.currentPage = 1;
            this.filters = {};
        }
        setFilter(key, value) {
            this.filters[key] = value;
            this.currentPage = 1;
        }
        async loadQuestions() {
            const params = new URLSearchParams({ page: this.currentPage });
            Object.entries(this.filters).forEach(([k, v]) => { if (v) params.set(k, v); });
            const response = await fetch(`/api/questions?${params}`);
            return response.json();
        }
        async createQuestion(data) {
            const response = await fetch('/api/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error('Failed to create');
            return response.json();
        }
        async updateQuestion(id, data) {
            const response = await fetch(`/api/questions/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error('Failed to update');
            return response.json();
        }
        async deleteQuestion(id) {
            const response = await fetch(`/api/questions/${id}`, { method: 'DELETE' });
            if (!response.ok) throw new Error('Failed to delete');
            return response.json();
        }
        prevPage() { if (this.currentPage > 1) this.currentPage--; }
        nextPage() { this.currentPage++; }
    }

    const questionManager = new QuestionManager();
    let deleteTargetId = null;

    // Load questions on page load
    document.addEventListener('DOMContentLoaded', loadQuestions);

    async function loadQuestions() {
        const data = await questionManager.loadQuestions();
        renderQuestions(data);
    }

    function renderQuestions(data) {
        const container = document.getElementById('questionsList');
        const emptyState = document.getElementById('emptyState');
        const pagination = document.getElementById('pagination');

        if (!data.questions || data.questions.length === 0) {
            container.innerHTML = '';
            emptyState.classList.remove('hidden');
            pagination.classList.add('hidden');
            return;
        }

        emptyState.classList.add('hidden');
        pagination.classList.remove('hidden');

        const typeLabels = {
            'vocabulary': '詞彙',
            'dialogue': '對話',
            'listening': '聽力'
        };

        const typeColors = {
            'vocabulary': 'bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400',
            'dialogue': 'bg-purple-100 text-purple-600 dark:bg-purple-900/30 dark:text-purple-400',
            'listening': 'bg-green-100 text-green-600 dark:bg-green-900/30 dark:text-green-400'
        };

        container.innerHTML = data.questions.map(q => `
            <div class="bg-slate-50 dark:bg-slate-800 rounded-xl p-4 hover:shadow-md transition-shadow">
                <div class="flex items-start justify-between gap-4">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${typeColors[q.type] || typeColors.vocabulary}">
                                ${typeLabels[q.type] || q.type}
                            </span>
                            <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-600 dark:bg-amber-900/30 dark:text-amber-400">
                                ${q.level}
                            </span>
                            <span class="text-xs text-slate-400">${q.topic}</span>
                        </div>
                        <p class="font-medium text-slate-900 dark:text-white line-clamp-2">${q.question?.text || ''}</p>
                        <div class="mt-2 flex flex-wrap gap-1">
                            ${(q.options || []).map(opt => `
                                <span class="text-xs px-2 py-0.5 rounded ${opt.is_correct ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-400'}">
                                    ${opt.id}: ${opt.text.substring(0, 15)}${opt.text.length > 15 ? '...' : ''}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="editQuestion('${q.id}')" class="w-8 h-8 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-primary">
                            <span class="material-symbols-outlined text-xl">edit</span>
                        </button>
                        <button onclick="confirmDelete('${q.id}')" class="w-8 h-8 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-400 hover:text-red-500">
                            <span class="material-symbols-outlined text-xl">delete</span>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');

        // Update pagination
        document.getElementById('pageInfo').textContent = `第 ${data.page} / ${data.total_pages} 頁`;
        document.getElementById('prevPageBtn').disabled = data.page <= 1;
        document.getElementById('nextPageBtn').disabled = data.page >= data.total_pages;
    }

    // Modal handling
    const modal = document.getElementById('questionModal');
    const form = document.getElementById('questionForm');

    document.getElementById('addQuestionBtn').addEventListener('click', () => {
        openModal();
    });

    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    function openModal(question = null) {
        document.getElementById('modalTitle').textContent = question ? '編輯題目' : '新增題目';
        document.getElementById('questionId').value = question?.id || '';
        document.getElementById('formType').value = question?.type || 'vocabulary';
        document.getElementById('formLevel').value = question?.level || 'A2';
        document.getElementById('formTopic').value = question?.topic || 'cuisine';
        document.getElementById('formQuestionText').value = question?.question?.text || '';
        document.getElementById('formAudioText').value = question?.question?.audio_text || '';

        // Render options
        const optionsContainer = document.getElementById('optionsContainer');
        const options = question?.options || [
            { id: 'A', text: '', is_correct: true },
            { id: 'B', text: '', is_correct: false },
            { id: 'C', text: '', is_correct: false },
            { id: 'D', text: '', is_correct: false }
        ];
        renderOptions(options);

        modal.classList.remove('hidden');
    }

    function closeModal() {
        modal.classList.add('hidden');
        form.reset();
    }

    function renderOptions(options) {
        const container = document.getElementById('optionsContainer');
        container.innerHTML = options.map((opt, index) => `
            <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center font-bold text-sm">${opt.id}</span>
                <input type="text" class="option-input flex-1 px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-0" value="${opt.text}" placeholder="選項內容">
                <label class="flex items-center gap-1">
                    <input type="radio" name="correctOption" value="${index}" ${opt.is_correct ? 'checked' : ''} class="text-primary focus:ring-primary">
                    <span class="text-xs text-slate-500">正確</span>
                </label>
                ${options.length > 2 ? `<button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-500"><span class="material-symbols-outlined text-xl">remove_circle</span></button>` : ''}
            </div>
        `).join('');
    }

    document.getElementById('addOptionBtn').addEventListener('click', () => {
        const container = document.getElementById('optionsContainer');
        const currentOptions = container.querySelectorAll('.option-input').length;
        if (currentOptions >= 6) return;

        const optionId = String.fromCharCode(65 + currentOptions);
        const div = document.createElement('div');
        div.className = 'flex items-center gap-2';
        div.innerHTML = `
            <span class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center font-bold text-sm">${optionId}</span>
            <input type="text" class="option-input flex-1 px-3 py-2 rounded-lg border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:border-primary focus:ring-0" placeholder="選項內容">
            <label class="flex items-center gap-1">
                <input type="radio" name="correctOption" value="${currentOptions}" class="text-primary focus:ring-primary">
                <span class="text-xs text-slate-500">正確</span>
            </label>
            <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-500"><span class="material-symbols-outlined text-xl">remove_circle</span></button>
        `;
        container.appendChild(div);
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const optionInputs = document.querySelectorAll('.option-input');
        const correctRadio = document.querySelector('input[name="correctOption"]:checked');
        const correctIndex = correctRadio ? parseInt(correctRadio.value) : 0;

        const options = Array.from(optionInputs).map((input, index) => ({
            id: String.fromCharCode(65 + index),
            text: input.value,
            is_correct: index === correctIndex
        }));

        const questionData = {
            type: document.getElementById('formType').value,
            level: document.getElementById('formLevel').value,
            topic: document.getElementById('formTopic').value,
            question_text: document.getElementById('formQuestionText').value,
            audio_text: document.getElementById('formAudioText').value || null,
            options: options
        };

        const questionId = document.getElementById('questionId').value;

        try {
            if (questionId) {
                await questionManager.updateQuestion(questionId, questionData);
            } else {
                await questionManager.createQuestion(questionData);
            }
            closeModal();
            loadQuestions();
        } catch (error) {
            alert('儲存失敗，請重試');
        }
    });

    async function editQuestion(id) {
        try {
            const response = await fetch(`/api/questions/${id}`);
            const question = await response.json();
            openModal(question);
        } catch (error) {
            alert('無法載入題目');
        }
    }

    // Delete handling
    function confirmDelete(id) {
        deleteTargetId = id;
        document.getElementById('deleteModal').classList.remove('hidden');
    }

    document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
        document.getElementById('deleteModal').classList.add('hidden');
        deleteTargetId = null;
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
        if (deleteTargetId) {
            await questionManager.deleteQuestion(deleteTargetId);
            document.getElementById('deleteModal').classList.add('hidden');
            deleteTargetId = null;
            loadQuestions();
        }
    });

    // Filters
    document.getElementById('searchInput').addEventListener('input', (e) => {
        questionManager.setFilter('search', e.target.value);
        loadQuestions();
    });

    document.getElementById('levelFilter').addEventListener('change', (e) => {
        questionManager.setFilter('level', e.target.value);
        loadQuestions();
    });

    document.getElementById('topicFilter').addEventListener('change', (e) => {
        questionManager.setFilter('topic', e.target.value);
        loadQuestions();
    });

    document.getElementById('typeFilter').addEventListener('change', (e) => {
        questionManager.setFilter('type', e.target.value);
        loadQuestions();
    });

    // Pagination
    document.getElementById('prevPageBtn').addEventListener('click', () => {
        questionManager.prevPage();
        loadQuestions();
    });

    document.getElementById('nextPageBtn').addEventListener('click', () => {
        questionManager.nextPage();
        loadQuestions();
    });

    // Show/hide audio text section based on type
    document.getElementById('formType').addEventListener('change', (e) => {
        const audioSection = document.getElementById('audioTextSection');
        if (e.target.value === 'listening') {
            audioSection.classList.remove('hidden');
        } else {
            audioSection.classList.add('hidden');
        }
    });
</script>
</body>
</html>
